<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPEC-0002 正式產物原地等待彩蛋測試</title>
    <style>
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        color: #1d2a33;
        background: #fff9e8;
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(1100px, 100vw);
      }

      iframe {
        display: block;
        width: 100%;
        min-height: 720px;
        border: 0;
        background: #fff9e8;
      }

      .test-controls,
      output {
        display: block;
        padding: 12px;
      }

      #focus-sink {
        border: 2px solid #1d2a33;
        border-radius: 8px;
        padding: 8px 12px;
        color: inherit;
        background: #ffd447;
        font: inherit;
        font-weight: 700;
      }

      output {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="test-controls">
        <button id="focus-sink" type="button">測試外框焦點</button>
      </div>
      <iframe id="production-frame" title="正式 dist 原地等待彩蛋"></iframe>
      <output id="playtest-result" data-status="booting" data-driver="playtest:idle-easter-egg">
        正在載入正式靜態產物。
      </output>
    </main>
    <script type="module" src="./idle-easter-egg.ts"></script>
  </body>
</html>

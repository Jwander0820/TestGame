<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14232b" />
    <meta name="description" content="一款會因為玩家一直死亡，開始偷偷作弊幫忙的橫向平台遊戲。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 8h40v19c0 14-9 23-20 29C21 50 12 41 12 27Z' fill='%23f3c743' stroke='%2314232b' stroke-width='5'/%3E%3Cpath d='M20 17h24v8H20z' fill='%23c84c42'/%3E%3Cpath d='M32 14v33' stroke='%232d4650' stroke-width='5'/%3E%3C/svg%3E" />
    <title>遊戲開始心軟了｜見習勇者的森林試煉</title>
  </head>
  <body>
    <div id="app">
      <main class="game-shell" data-game-started="false" data-menu-open="true" data-visual-stage="royal-trial" aria-labelledby="game-title">
        <header class="game-header">
          <div>
            <p class="eyebrow">王城外圍　／　第一章</p>
            <h1 id="game-title">遊戲開始心軟了</h1>
          </div>
          <div class="header-actions">
            <button id="pause-button" class="utility-button" type="button" aria-label="暫停遊戲" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                <path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z" fill="currentColor" />
              </svg>
              <span>暫停</span>
            </button>
            <div class="death-ticket" aria-label="目前陣亡次數">
              <span>陣亡</span>
              <strong id="death-count">0</strong>
              <span>次</span>
            </div>
          </div>
        </header>

        <section class="stage-frame" aria-label="遊戲舞台">
          <canvas id="title-landscape" width="960" height="540" aria-hidden="true"></canvas>
          <div id="game-root" role="region" tabindex="0" aria-label="2D 橫向平台遊戲；使用左右方向與跳躍操作"></div>
          <div id="game-menu" class="game-menu">
            <section class="menu-panel" data-menu-panel="title" aria-labelledby="title-panel-heading">
              <p class="menu-kicker">見習勇者的第一場試煉</p>
              <h2 id="title-panel-heading">往森林深處，<br />再走一步。</h2>
              <p id="continue-summary" class="menu-copy">從王城外圍的新手森林出發。</p>
              <div class="menu-actions">
                <button id="start-button" class="menu-button primary-action" type="button">踏上旅程</button>
              </div>
              <p class="title-controls">← → 移動　·　空白鍵跳躍<br />手機使用畫面下方的三個按鍵</p>
            </section>

            <section class="menu-panel" data-menu-panel="pause" aria-labelledby="pause-panel-heading" hidden>
              <p class="menu-kicker">旅程暫停</p>
              <h2 id="pause-panel-heading">森林暫時安靜下來了</h2>
              <p class="menu-copy">進度自動保存在安全據點。重走本關會保留死亡與援助。</p>
              <div class="menu-actions">
                <button id="resume-button" class="menu-button primary-action" type="button">返回旅程</button>
                <button id="restart-button" class="menu-button" type="button">重走本關</button>
                <button id="mute-button" class="menu-button" type="button">靜音</button>
                <button id="clear-button" class="menu-button danger-action" type="button">清除紀錄</button>
              </div>
            </section>

            <section class="menu-panel" data-menu-panel="complete" aria-labelledby="complete-panel-heading" hidden>
              <p class="menu-kicker">王城試煉完成</p>
              <h2 id="complete-panel-heading">世界先投降了</h2>
              <p id="complete-summary" class="menu-copy"></p>
              <div class="menu-actions">
                <button id="replay-button" class="menu-button primary-action" type="button">再次啟程</button>
                <button id="title-button" class="menu-button" type="button">回標題</button>
              </div>
            </section>
          </div>
        </section>

        <div class="journey-bar" aria-label="旅程進度" hidden>
          <span id="checkpoint-label">森林入口</span>
          <ol class="checkpoint-track" aria-label="安全據點">
            <li aria-current="step">入口</li><li>林間</li><li>古橋</li><li>城門</li>
          </ol>
          <span class="keyboard-hint">← → 移動 · 空白鍵跳躍 · Esc 暫停</span>
        </div>
        <p id="game-status" class="game-status" role="status" aria-atomic="true">
          方向鍵或 A／D 移動，空白鍵跳躍。
        </p>

        <nav class="touch-controls" aria-label="觸控遊戲操作">
          <div class="movement-controls">
            <button class="control-button" type="button" data-action="left" aria-label="向左移動">
              <span aria-hidden="true">←</span>
            </button>
            <button class="control-button" type="button" data-action="right" aria-label="向右移動">
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <button class="control-button jump-button" type="button" data-action="jump" aria-label="跳躍">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
              <path d="M12 4 5.5 11h4v9h5v-9h4L12 4Z" fill="currentColor" />
            </svg>
            <span>跳</span>
          </button>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9e8" />
    <meta name="description" content="一款會因為玩家一直死亡，開始偷偷作弊幫忙的橫向平台遊戲。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%23ffd447' stroke='%231d2a33' stroke-width='6'/%3E%3Ccircle cx='23' cy='28' r='4' fill='%231d2a33'/%3E%3Ccircle cx='41' cy='28' r='4' fill='%231d2a33'/%3E%3Cpath d='M20 40c8 8 16 8 24 0' fill='none' stroke='%23b9382c' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>遊戲開始心軟了｜首個垂直切片</title>
  </head>
  <body>
    <div id="app">
      <main class="game-shell" data-game-started="false" data-menu-open="true" aria-labelledby="game-title">
        <header class="game-header">
          <div>
            <p class="eyebrow">PLAYABLE SLICE · 001</p>
            <h1 id="game-title">遊戲開始心軟了</h1>
          </div>
          <div class="header-actions">
            <button id="pause-button" class="utility-button" type="button" aria-label="暫停遊戲" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                <path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z" fill="currentColor" />
              </svg>
              <span>暫停</span>
            </button>
            <div class="death-ticket" aria-label="目前死亡次數">
              <span>死亡</span>
              <strong id="death-count">0</strong>
              <span>次</span>
            </div>
          </div>
        </header>

        <section class="stage-frame" aria-label="遊戲舞台">
          <div id="game-root" tabindex="0" aria-label="2D 橫向平台遊戲；使用左右方向與跳躍操作"></div>
          <div id="game-menu" class="game-menu">
            <section class="menu-panel" data-menu-panel="title" aria-labelledby="title-panel-heading">
              <p class="menu-kicker">第一張作業</p>
              <h2 id="title-panel-heading">走到右邊。<br />遊戲會盡量不插手。</h2>
              <p id="continue-summary" class="menu-copy">尚未留下任何可疑紀錄。</p>
              <div class="menu-actions">
                <button id="start-button" class="menu-button primary-action" type="button">開始</button>
              </div>
            </section>

            <section class="menu-panel" data-menu-panel="pause" aria-labelledby="pause-panel-heading" hidden>
              <p class="menu-kicker">先停一下</p>
              <h2 id="pause-panel-heading">遊戲正在假裝反省</h2>
              <div class="menu-actions">
                <button id="resume-button" class="menu-button primary-action" type="button">繼續</button>
                <button id="restart-button" class="menu-button" type="button">重來本關</button>
                <button id="mute-button" class="menu-button" type="button">靜音</button>
                <button id="clear-button" class="menu-button danger-action" type="button">清除紀錄</button>
              </div>
            </section>

            <section class="menu-panel" data-menu-panel="complete" aria-labelledby="complete-panel-heading" hidden>
              <p class="menu-kicker">本題完成</p>
              <h2 id="complete-panel-heading">世界先投降了</h2>
              <p id="complete-summary" class="menu-copy"></p>
              <div class="menu-actions">
                <button id="replay-button" class="menu-button primary-action" type="button">再寫一次</button>
                <button id="title-button" class="menu-button" type="button">回標題</button>
              </div>
            </section>
          </div>
        </section>

        <p id="game-status" class="game-status" aria-live="polite">
          方向鍵或 A／D 移動，空白鍵跳躍。
        </p>

        <nav class="touch-controls" aria-label="觸控遊戲操作">
          <div class="movement-controls">
            <button class="control-button" type="button" data-action="left" aria-label="向左移動">
              <span aria-hidden="true">←</span>
            </button>
            <button class="control-button" type="button" data-action="right" aria-label="向右移動">
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <button class="control-button jump-button" type="button" data-action="jump" aria-label="跳躍">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
              <path d="M12 4 5.5 11h4v9h5v-9h4L12 4Z" fill="currentColor" />
            </svg>
            <span>跳</span>
          </button>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
